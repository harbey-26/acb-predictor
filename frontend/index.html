<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basketball Predictor · ACB &amp; BBL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=4.0.0" />
</head>
<body>
  <!-- Decorative Background Glow Blobs -->
  <div class="glow-blob glow-orange"></div>
  <div class="glow-blob glow-blue"></div>
  <header>
    <div class="header-inner">
      <span class="logo-icon">🏀</span>
      <div>
        <h1 id="header-title">Basketball Predictor</h1>
        <p class="subtitle" id="header-subtitle">Predicción de partidos · Modelo ML</p>
      </div>
    </div>
  </header>

  <main>
    <!-- Selector de liga -->
    <section class="card league-card">
      <h2>Liga</h2>
      <div class="league-selector">
        <button class="league-btn active" data-liga="acb" id="btn-liga-acb">
          <span class="league-flag">🇪🇸</span>
          <span class="league-name">ACB · Liga Endesa</span>
        </button>
        <button class="league-btn" data-liga="bbl" id="btn-liga-bbl">
          <span class="league-flag">🇩🇪</span>
          <span class="league-name">BBL · Bundesliga</span>
        </button>
      </div>
      <div id="bbl-notice" class="bbl-notice hidden">
        El modelo BBL se está entrenando. Vuelve en unos minutos.
      </div>
    </section>

    <section class="card selector-card">
      <h2>Selecciona los equipos</h2>

      <div class="team-row">
        <!-- Equipo local -->
        <div class="team-block">
          <label class="team-label local-label">🏠 Local</label>
          <div class="select-wrapper">
            <select id="sel-local" class="team-select">
              <option value="">— Elige equipo —</option>
            </select>
          </div>
        </div>

        <!-- Botón intercambiar -->
        <button id="btn-swap" class="swap-btn" title="Intercambiar local/visitante">⇄</button>

        <!-- Equipo visitante -->
        <div class="team-block">
          <label class="team-label visit-label">✈️ Visitante</label>
          <div class="select-wrapper">
            <select id="sel-visit" class="team-select">
              <option value="">— Elige equipo —</option>
            </select>
          </div>
        </div>
      </div>

      <button id="btn-predict" class="predict-btn" disabled>
        Predecir partido
      </button>
    </section>

    <!-- Resultado -->
    <section id="result-card" class="card result-card hidden">
      <div id="result-content"></div>
    </section>

    <!-- Error -->
    <div id="error-box" class="error-box hidden"></div>

    <!-- Loading -->
    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <p>Calculando predicción…</p>
    </div>
  </main>

  <footer>
    <p id="footer-text">Datos: 5 temporadas (2020-21 → 2024-25) · Liga ACB &amp; BBL</p>
  </footer>

  <script src="/static/app.js?v=4"></script>
</body>
</html>
